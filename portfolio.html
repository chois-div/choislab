<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포트폴리오 — 초이스랩</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --black:#0a0a0a;--white:#f5f3ee;--accent:#4F46FF;
  --gray1:#1a1a1a;--gray3:#555;--gray4:#888;
  --border:rgba(255,255,255,0.08);
  --font:'Pretendard',sans-serif;
}
body{background:var(--black);color:var(--white);font-family:var(--font);font-weight:300;overflow-x:hidden;}

/* NAV */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding:0 48px;height:64px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(20px);
  background:rgba(10,10,10,0.7);
}
.nav-logo img{height:36px;width:auto;display:block;}
.nav-back{
  font-family:var(--font);font-size:12px;
  letter-spacing:0.1em;text-transform:uppercase;
  color:var(--gray4);text-decoration:none;
  display:flex;align-items:center;gap:8px;
  transition:color 0.2s;
}
.nav-back:hover{color:var(--white);}
.nav-cta{
  background:var(--accent);color:var(--white);
  font-size:12px;letter-spacing:0.1em;text-transform:uppercase;
  border:none;padding:10px 20px;cursor:pointer;
  text-decoration:none;transition:background 0.2s;
}
.nav-cta:hover{background:#3730cc;}

/* HERO */
.page-hero{
  padding:120px 48px 64px;
  border-bottom:1px solid var(--border);
}
.page-label{
  font-size:11px;letter-spacing:0.2em;color:var(--accent);
  text-transform:uppercase;margin-bottom:16px;
  display:flex;align-items:center;gap:10px;
}
.page-label::before{content:'';display:block;width:24px;height:1px;background:var(--accent);}
.page-title{
  font-size:clamp(40px,6vw,80px);font-weight:800;
  line-height:1;letter-spacing:-0.03em;margin-bottom:16px;
}
.page-desc{font-size:15px;color:var(--gray4);line-height:1.8;}

/* FILTER */
.filter-wrap{
  padding:32px 48px;
  border-bottom:1px solid var(--border);
  display:flex;gap:4px;flex-wrap:wrap;
}
.filter-tab{
  font-family:var(--font);font-size:11px;letter-spacing:0.1em;
  text-transform:uppercase;padding:10px 20px;
  background:transparent;color:var(--gray4);
  border:1px solid var(--border);cursor:pointer;transition:all 0.2s;
}
.filter-tab.active,.filter-tab:hover{
  background:var(--accent);color:var(--white);border-color:var(--accent);
}

/* GRID */
.portfolio-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:2px;
  padding:2px;
}
.portfolio-item{background:var(--gray1);overflow:hidden;}
.portfolio-item.hidden{display:none;}
.portfolio-img{
  width:100%;aspect-ratio:16/10;overflow:hidden;
  position:relative;
}
.portfolio-img img{
  width:100%;height:100%;object-fit:cover;
  transition:transform 0.6s ease;
  display:block;
}
.portfolio-item:hover .portfolio-img img{transform:scale(1.04);}
.portfolio-info{padding:20px 24px;}
.portfolio-tag{
  font-size:10px;letter-spacing:0.15em;text-transform:uppercase;
  color:var(--accent);margin-bottom:8px;
}
.portfolio-name{font-size:18px;font-weight:500;margin-bottom:4px;}
.portfolio-sub{font-size:13px;color:var(--gray4);}

/* CTA */
.cta-bar{
  padding:80px 48px;text-align:center;
  border-top:1px solid var(--border);
  background:var(--gray1);
}
.cta-bar h2{
  font-size:clamp(32px,5vw,56px);font-weight:800;
  letter-spacing:-0.03em;margin-bottom:16px;
}
.cta-bar p{font-size:15px;color:var(--gray4);margin-bottom:32px;}
.btn-primary{
  background:var(--accent);color:var(--white);
  font-size:12px;letter-spacing:0.1em;text-transform:uppercase;
  padding:16px 36px;text-decoration:none;display:inline-block;
  transition:background 0.2s,transform 0.2s;
}
.btn-primary:hover{background:#3730cc;transform:translateY(-2px);}

/* FOOTER */
footer{
  background:var(--gray1);padding:48px;
  border-top:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
  flex-wrap:wrap;gap:16px;
}
.footer-copy{font-size:11px;letter-spacing:0.1em;color:var(--gray3);text-transform:uppercase;}
.footer-contact{font-size:13px;color:var(--gray4);}
.footer-contact a{color:var(--gray4);text-decoration:none;}
.footer-contact a:hover{color:var(--white);}

/* MOBILE */
@media(max-width:768px){
  nav{padding:0 20px;height:56px;}
  .nav-logo img{height:28px;}
  .page-hero{padding:80px 20px 48px;}
  .filter-wrap{padding:20px;}
  .portfolio-grid{grid-template-columns:1fr;}
  .cta-bar{padding:60px 20px;}
  footer{padding:32px 20px;flex-direction:column;align-items:flex-start;}
}
@media(max-width:1024px){
  .portfolio-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>

<div class="page-hero">
  <div class="page-label">Portfolio</div>
  <h1 class="page-title">직접 만든<br>결과물들</h1>
  <p class="page-desc">초이스랩이 기획부터 제작까지 함께한 브랜드들입니다.</p>
</div>

<div class="filter-wrap" id="filterWrap">
  <button class="filter-tab active" onclick="filterWork(this,'all')">전체 (<span data-count="all">0</span>)</button>
  <button class="filter-tab" onclick="filterWork(this,'web')">홈페이지 (<span data-count="web">0</span>)</button>
  <button class="filter-tab" onclick="filterWork(this,'landing')">랜딩페이지 (<span data-count="landing">0</span>)</button>
  <button class="filter-tab" onclick="filterWork(this,'sns')">SNS (<span data-count="sns">0</span>)</button>
</div>

<div class="portfolio-grid" id="grid">
  <!-- populated by JS from data/portfolio.json -->
</div>

<div class="cta-bar">
  <h2>다음은<br>당신의 브랜드</h2>
  <p>일단 물어봐도 괜찮아요. 1영업일 내에 방향부터 같이 잡아드립니다.</p>

</div>

<script>
const CATEGORY_LABELS = { web: '홈페이지 제작', landing: '랜딩페이지', sns: 'SNS 콘텐츠' };
const grid = document.getElementById('grid');

function filterWork(btn, cat) {
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.portfolio-item').forEach(item => {
    if (cat === 'all' || item.dataset.cat === cat) {
      item.classList.remove('hidden');
      item.style.opacity = '0';
      setTimeout(() => {
        item.style.transition = 'opacity 0.4s';
        item.style.opacity = '1';
      }, 10);
    } else {
      item.style.opacity = '0';
      setTimeout(() => item.classList.add('hidden'), 400);
    }
  });
}

function observeReveal() {
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.style.opacity = '1';
        entry.target.style.transform = 'translateY(0)';
      }
    });
  }, { threshold: 0.1 });

  document.querySelectorAll('.portfolio-item').forEach((el, i) => {
    el.style.opacity = '0';
    el.style.transform = 'translateY(24px)';
    el.style.transition = `opacity 0.5s ${i % 3 * 0.08}s ease, transform 0.5s ${i % 3 * 0.08}s ease`;
    observer.observe(el);
  });
}

fetch('data/portfolio.json')
  .then(res => res.json())
  .then(data => {
    const items = data.portfolio || [];
    grid.innerHTML = items.map(p => `
    <div class="portfolio-item" data-cat="${p.category}">
      <div class="portfolio-img">
        <img src="${p.image}" alt="${p.name}" loading="lazy">
      </div>
      <div class="portfolio-info">
        <div class="portfolio-tag">${CATEGORY_LABELS[p.category] || p.category}</div>
        <div class="portfolio-name">${p.name}</div>
        <div class="portfolio-sub">${p.sub}</div>
      </div>
    </div>`).join('');

    const counts = { all: items.length, web: 0, landing: 0, sns: 0 };
    items.forEach(p => { if (counts[p.category] !== undefined) counts[p.category]++; });
    document.querySelectorAll('[data-count]').forEach(el => {
      el.textContent = counts[el.dataset.count] ?? 0;
    });

    observeReveal();
  })
  .catch(err => console.error('Failed to load portfolio data:', err));
</script>
