<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>초이스랩 어드민</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root {
  --bg: #0B1220; --surface: #111827; --raised: #1C2333; --border: #263044;
  --text: #F2F4F8; --text2: #9AA4B2; --muted: #8A94A5;
  --primary: #5B4FFF; --blue: #3D82F7; --ok: #34D399; --warn: #F5B544; --danger: #F25C5C;
  --font: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; }
a { color: var(--blue); }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---- login ---- */
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; }
.login-card { width: 100%; max-width: 400px; padding: 36px 32px 32px; display: flex; flex-direction: column; gap: 20px; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 20px; letter-spacing: -0.01em; }
.tag { font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 4px; background: rgba(91,79,255,0.2); color: var(--blue); }
.login-card h1 { font-size: 22px; font-weight: 800; }
.login-card p.sub { color: var(--text2); font-size: 13px; margin-top: 4px; }
.field { display: flex; flex-direction: column; gap: 6px; border: 0; min-width: 0; }
.field label, .field .lab { font-size: 13px; font-weight: 600; color: var(--text2); }
.input { background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 12px 14px; font-size: 14px; width: 100%; }
textarea.input { min-height: 96px; resize: vertical; line-height: 1.55; }
.btn { background: var(--primary); color: #fff; border: 0; border-radius: 8px; padding: 12px 18px; font-size: 14px; font-weight: 700; }
.btn:hover { filter: brightness(1.1); }
.btn:disabled { opacity: 0.55; cursor: progress; }
.btn.secondary { background: var(--raised); color: var(--text); }
.btn.small { padding: 8px 12px; font-size: 13px; }
.btn.danger { background: rgba(242,92,92,0.16); color: #FF9A9A; }
.linkbtn { background: none; border: 0; color: var(--blue); font-weight: 600; font-size: 13px; padding: 2px 4px; }
.linkbtn:hover { text-decoration: underline; }
.linkbtn.warn { color: var(--danger); }
.msg-error { background: rgba(242,92,92,0.12); color: #FF9A9A; border-radius: 8px; padding: 10px 12px; font-size: 13px; }

/* ---- shell ---- */
.shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
.sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 24px 16px 20px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
.sidebar .logo { padding: 0 8px 20px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; color: var(--text2); text-decoration: none; font-weight: 600; font-size: 14px; border: 0; background: none; width: 100%; text-align: left; }
.nav-item:hover { background: rgba(255,255,255,0.04); }
.nav-item.active { background: rgba(91,79,255,0.16); color: var(--text); }
.nav-item.disabled { color: var(--muted); cursor: default; }
.nav-item .grow { flex: 1; }
.nav-item svg { flex-shrink: 0; }
.pill { font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 10px; background: var(--primary); color: #fff; }
.pill.soon { background: var(--raised); color: var(--muted); font-weight: 600; font-size: 10px; }
.sidebar .spacer { flex: 1; }
.sidebar .me { border-top: 1px solid var(--border); padding: 14px 12px 0; display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--text2); word-break: break-all; }
.sidebar .me button { align-self: flex-start; background: none; border: 0; color: var(--muted); font-size: 12px; font-weight: 600; padding: 0; }
.sidebar .me button:hover { color: var(--text); }
.main { padding: 32px 40px 48px; min-width: 0; }
.page-head { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.page-head .titles { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
.page-head h2 { font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.page-head p { color: var(--text2); font-size: 13px; }
.crumb { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
.crumb a { color: var(--muted); text-decoration: none; }
.crumb a:hover { color: var(--text); }

/* ---- badges / chips ---- */
.badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
.badge.info { background: rgba(61,130,247,0.16); color: var(--blue); }
.badge.warn { background: rgba(245,181,68,0.16); color: var(--warn); }
.badge.ok { background: rgba(52,211,153,0.16); color: var(--ok); }
.badge.bad { background: rgba(242,92,92,0.16); color: var(--danger); }
.badge.purple { background: rgba(91,79,255,0.22); color: #B7B1FF; }
.badge.neutral { background: var(--raised); color: var(--text2); }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
.tab { background: var(--surface); border: 1px solid var(--border); color: var(--text2); border-radius: 16px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.tab.active { background: rgba(91,79,255,0.16); border-color: transparent; color: var(--blue); }

/* ---- dashboard ---- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; margin-bottom: 20px; }
.kpi { padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; text-align: left; color: var(--text); font: inherit; }
button.kpi:hover { border-color: #34405a; }
.kpi .l { font-size: 13px; font-weight: 600; color: var(--text2); }
.kpi .v { font-size: 26px; font-weight: 800; }
.kpi .h { font-size: 12px; color: var(--muted); }
.panel-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 12px; font-weight: 800; font-size: 15px; gap: 8px; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }

/* ---- inbox / lists ---- */
.inbox { display: grid; grid-template-columns: 400px minmax(0, 1fr); gap: 16px; align-items: start; }
.list { overflow: hidden; }
.row { display: flex; flex-direction: column; gap: 6px; padding: 14px 18px; border: 0; border-bottom: 1px solid var(--border); background: none; color: var(--text); text-align: left; width: 100%; }
.row:last-child { border-bottom: 0; }
.row:hover { background: rgba(255,255,255,0.03); }
.row.selected { background: rgba(91,79,255,0.1); }
.row .top { display: flex; align-items: center; gap: 8px; }
.row .name { font-weight: 800; }
.row .when { margin-left: auto; font-size: 12px; color: var(--muted); }
.row .type { font-size: 12px; color: var(--text2); }
.row .snip { font-size: 13px; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); flex-shrink: 0; }
.empty { padding: 40px 20px; text-align: center; color: var(--text2); }
.detail { overflow: hidden; }
.detail-head { display: flex; align-items: center; gap: 10px; padding: 20px 24px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.detail-head h3 { font-size: 20px; font-weight: 800; }
.detail-head .at { margin-left: auto; font-size: 12px; color: var(--muted); }
.back { display: none; background: none; border: 0; color: var(--blue); font-weight: 600; padding: 0 0 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; padding: 20px 24px 8px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; padding: 4px 20px 18px; }
.kv { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kv .k { font-size: 12px; color: var(--muted); }
.kv .vv { font-size: 14px; font-weight: 600; word-break: break-all; }
.vv.danger { color: var(--danger); } .vv.ok { color: var(--ok); } .vv.warn { color: var(--warn); }
.section { padding: 12px 24px; display: flex; flex-direction: column; gap: 8px; }
.section .t { font-size: 12px; color: var(--muted); }
.ref { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; background: rgba(255,255,255,0.05); font-size: 13px; }
.ref .type { font-size: 11px; font-weight: 800; color: var(--blue); }
.ref .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.ref .meta { color: var(--muted); font-size: 12px; }
.ref button { background: none; border: 0; color: var(--blue); font-weight: 600; font-size: 12px; }
.bubble { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 14px 16px; white-space: pre-wrap; word-break: break-word; line-height: 1.65; }
.actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 16px 24px 20px; border-top: 1px solid var(--border); margin-top: 8px; }
.actions .lbl { font-size: 12px; color: var(--muted); margin-right: 4px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { background: var(--bg); border: 0; color: var(--text2); padding: 8px 12px; font-size: 13px; font-weight: 600; border-right: 1px solid var(--border); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--raised); color: var(--text); }
.convert { margin-left: auto; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--raised); border: 1px solid var(--border); padding: 10px 16px; border-radius: 10px; font-size: 13px; z-index: 40; }

/* ---- projects board ---- */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(200px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; align-items: start; }
.col { background: rgba(17,24,39,0.5); border-radius: 12px; padding: 10px 8px; display: flex; flex-direction: column; gap: 10px; min-height: 120px; }
.col .ch { display: flex; align-items: center; gap: 8px; padding: 0 6px 2px; font-weight: 800; }
.col .ch .n { color: var(--muted); font-weight: 600; font-size: 13px; }
.pcard { display: flex; flex-direction: column; gap: 8px; padding: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; text-align: left; color: var(--text); width: 100%; }
.pcard:hover { border-color: #34405a; }
.pcard .nm { font-weight: 800; font-size: 14px; }
.pcard .cu { font-size: 12px; color: var(--text2); }
.pcard .meta { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
.pcard .meta .due { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--muted); }
.due.hot { color: var(--warn) !important; }
.flags { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---- project detail ---- */
.stepper { display: flex; align-items: center; gap: 10px; padding: 16px 20px; overflow-x: auto; margin-bottom: 16px; }
.stepper .st { display: flex; align-items: center; gap: 8px; background: none; border: 0; color: var(--muted); font-weight: 600; font-size: 14px; white-space: nowrap; padding: 2px 0; }
.stepper .st .c { width: 22px; height: 22px; border-radius: 50%; background: var(--raised); flex-shrink: 0; }
.stepper .st.done .c { background: var(--primary); }
.stepper .st.done { color: var(--text); }
.stepper .st.cur .c { background: var(--bg); border: 3px solid var(--blue); }
.stepper .st.cur { color: var(--text); font-weight: 800; }
.stepper .ln { flex: 1; min-width: 20px; height: 2px; background: var(--border); }
.stepper .ln.done { background: var(--primary); }
.cols2 { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 8px 12px; background: rgba(28,35,51,0.5); }
.tbl td { padding: 12px; border-top: 1px solid var(--border); vertical-align: middle; }
.tbl td.act { text-align: right; white-space: nowrap; }
.tbl-wrap { overflow-x: auto; }
.mini { padding: 4px 20px 18px; display: flex; flex-direction: column; gap: 10px; }
.mini .line { display: flex; gap: 12px; font-size: 13px; }
.mini .line .k { color: var(--muted); width: 72px; flex-shrink: 0; }
.mini .line .vv { font-weight: 600; flex: 1; min-width: 0; word-break: break-all; }
.memo { padding: 4px 20px 18px; white-space: pre-wrap; word-break: break-word; font-size: 13px; color: var(--text2); line-height: 1.6; }

/* ---- slide-over panel ---- */
.overlay { position: fixed; inset: 0; background: rgba(11,18,32,0.7); z-index: 30; display: flex; justify-content: flex-end; }
.panel { width: 520px; max-width: 100%; height: 100%; background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
.panel-top { display: flex; align-items: center; padding: 20px 28px 16px; border-bottom: 1px solid var(--border); }
.panel-top h3 { font-size: 18px; font-weight: 800; flex: 1; }
.panel-top button { background: none; border: 0; color: var(--muted); font-size: 18px; padding: 4px 8px; }
.panel-body { flex: 1; overflow-y: auto; padding: 20px 28px; display: flex; flex-direction: column; gap: 14px; }
.panel-body .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.panel-body .sectionlab { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 800; color: var(--blue); padding-top: 6px; }
.panel-body .sectionlab::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; pointer-events: none; }
.chip span { display: inline-block; padding: 7px 14px; border-radius: 16px; border: 1px solid var(--border); background: var(--bg); color: var(--text2); font-size: 13px; font-weight: 600; cursor: pointer; }
.chip input:checked + span { background: var(--primary); border-color: var(--primary); color: #fff; }
.chip input:focus-visible + span { outline: 2px solid #fff; outline-offset: 2px; }
.toggle { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; }
.toggle input { width: 18px; height: 18px; accent-color: var(--primary); }
.panel-foot { display: flex; align-items: center; gap: 10px; padding: 16px 28px 20px; border-top: 1px solid var(--border); }
.panel-foot .sp { flex: 1; }
.form-error { color: #FF9A9A; font-size: 13px; min-height: 18px; }

/* ---- applications ---- */
.toolrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.toolrow .grow { flex: 1; }
.search { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px 12px; font-size: 13px; width: 240px; }
.apptbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.apptbl th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 9px 12px; background: rgba(28,35,51,0.5); white-space: nowrap; }
.apptbl td { padding: 12px; border-top: 1px solid var(--border); vertical-align: middle; color: var(--text2); }
.apptbl tr.click { cursor: pointer; }
.apptbl tr.click:hover td { background: rgba(255,255,255,0.03); }
.apptbl td.t { color: var(--text); font-weight: 600; max-width: 360px; }
.apptbl td.t span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.apptbl td.n { white-space: nowrap; }
.bars { padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
.bar .top { display: flex; margin-bottom: 6px; font-size: 13px; font-weight: 600; }
.bar .top .n { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 12px; }
.track { height: 8px; border-radius: 4px; background: var(--raised); overflow: hidden; }
.fill { height: 100%; background: var(--blue); border-radius: 4px; min-width: 3px; }
.fill.ok { background: var(--ok); }
.hint { color: var(--muted); font-size: 12px; padding: 4px 20px 16px; line-height: 1.6; }
.traffic { margin-top: 20px; }
.tkpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; padding: 0 20px 16px; }
.tk { display: flex; flex-direction: column; gap: 4px; }
.tk .l { font-size: 12px; font-weight: 600; color: var(--text2); }
.tk .v { font-size: 22px; font-weight: 800; }
.tk .d { font-size: 12px; font-weight: 600; color: var(--muted); }
.tk .d.up { color: var(--ok); }
.tk .d.down { color: var(--danger); }
.spark { display: flex; align-items: flex-end; gap: 2px; height: 88px; margin: 0 20px; }
.spark i { flex: 1; min-width: 2px; background: var(--blue); border-radius: 2px 2px 0 0; opacity: 0.9; }
.sparkcap { display: flex; justify-content: space-between; padding: 6px 20px 16px; font-size: 11px; color: var(--muted); }
.tgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px 16px; border-top: 1px solid var(--border); }
.tgrid .sub { padding: 16px 20px 0; font-size: 13px; font-weight: 800; color: var(--text2); }
.tgrid .bars { padding-top: 12px; }
.bar .top span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 8px; }
.bar .top .n { flex-shrink: 0; }
.naver { display: flex; align-items: baseline; gap: 8px; padding: 12px 20px 0; font-size: 13px; }
.naver b { color: var(--ok); font-size: 15px; }
.naver .k { color: var(--muted); font-size: 12px; }
.import-box { display: flex; flex-direction: column; gap: 12px; }
.import-box .sum { display: flex; gap: 8px; flex-wrap: wrap; }
.import-box .warns { background: rgba(245,181,68,0.1); border-radius: 10px; padding: 12px 14px; font-size: 12px; color: var(--text2); line-height: 1.7; max-height: 150px; overflow: auto; }
.import-box .warns b { color: var(--warn); display: block; margin-bottom: 2px; font-size: 13px; }
.import-box .file { display: flex; gap: 10px; align-items: center; background: rgba(28,35,51,0.6); border-radius: 10px; padding: 12px 14px; font-size: 13px; }
.import-box .file b { color: var(--text); }
.import-box input[type=file] { font-size: 13px; color: var(--text2); }
.pv { width: 100%; border-collapse: collapse; font-size: 12px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.pv th, .pv td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.pv th { color: var(--muted); background: rgba(28,35,51,0.5); font-weight: 600; }
.pv td { color: var(--text2); }

@media (max-width: 960px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 12px 16px; border-right: 0; border-bottom: 1px solid var(--border); }
  .sidebar .logo { padding: 0 12px 0 0; }
  .sidebar .spacer { display: none; }
  .sidebar .me { border-top: 0; padding: 0 0 0 auto; flex-direction: row; gap: 10px; align-items: center; margin-left: auto; }
  .nav-item { width: auto; padding: 8px 10px; }
  .main { padding: 20px 16px 40px; }
  .inbox { grid-template-columns: 1fr; }
  .inbox.has-selected .list { display: none; }
  .inbox:not(.has-selected) .detail-col { display: none; }
  .back { display: block; }
  .grid3 { grid-template-columns: 1fr 1fr; }
  .grid4 { grid-template-columns: 1fr 1fr; }
  .cols2, .two { grid-template-columns: 1fr; }
  .panel { width: 100%; }
}
</style>
</head>

        summary.appendChild(el('span', { class: 'badge ok', text: '가져올 수 있음 ' + (parsed.items.length - dup) + '건' }));
        summary.appendChild(el('span', { class: 'badge ' + (dup ? 'neutral' : 'neutral'), text: '이미 있음 ' + dup + '건 (건너뜀)' }));
        if (parsed.warns.length) summary.appendChild(el('span', { class: 'badge warn', text: '확인 필요 ' + parsed.warns.length + '건' }));
        warnBox.hidden = !parsed.warns.length; warnBox.replaceChildren();
        warnBox.appendChild(el('b', { text: '확인이 필요한 항목' }));
        parsed.warns.slice(0, 40).forEach(function (w) { warnBox.appendChild(el('div', { text: '• ' + w })); });
        if (parsed.warns.length > 40) warnBox.appendChild(el('div', { text: '… 외 ' + (parsed.warns.length - 40) + '건' }));
        if (parsed.items.length) preview.appendChild(el('table', { class: 'pv' }, el('thead', null, el('tr', null, ['지원일', '의뢰명', '예산', '상태', '경쟁'].map(function (h) { return el('th', { text: h }); }))),
          el('tbody', null, parsed.items.slice(0, 5).map(function (it) { return el('tr', null, el('td', { text: it.applied_on ? dateOnly(it.applied_on) : '(미기재)' }), el('td', { text: it.title }), el('td', { text: it.budget_text || '-' }), el('td', { text: it.status }), el('td', { text: it.competitors === null ? '-' : String(it.competitors) })); }))));
        go.disabled = !parsed.items.length; go.textContent = parsed.items.length ? (parsed.items.length - dup) + '건 가져오기' : '가져올 항목 없음';
      };
      rd.readAsText(f, 'utf-8');
    });
    go.addEventListener('click', function () {
      if (!parsed || !parsed.items.length) return;
      go.disabled = true; go.textContent = '가져오는 중…'; errBox.textContent = '';
      var chunks = [], i;
      for (i = 0; i < parsed.items.length; i += 200) chunks.push(parsed.items.slice(i, i + 200));
      var added = 0;
      chunks.reduce(function (p, ch) { return p.then(function () { return rest('POST', 'applications?on_conflict=applied_on,title', ch, 'resolution=ignore-duplicates,return=representation').then(function (saved) { added += (saved || []).length; }); }); }, Promise.resolve())
        .then(function () { close(); toast('가져오기 완료 · 새로 ' + added + '건, 이미 있던 ' + (parsed.items.length - added) + '건은 건너뜀'); return loadAll().then(render); })
        .catch(function () { go.disabled = false; go.textContent = '다시 시도'; errBox.textContent = '가져오지 못했어요. 일부만 저장됐을 수 있으니 같은 파일을 다시 올리면 중복 없이 이어서 저장돼요.'; });
    });
    var panel = el('div', { class: 'panel', style: 'width:640px', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'CSV 가져오기' },
      el('div', { class: 'panel-top' }, el('h3', { text: '지원 현황 CSV 가져오기' }), el('button', { type: 'button', 'aria-label': '닫기', onclick: function () { close(); }, text: '✕' })),
      el('div', { class: 'panel-body' }, el('div', { class: 'import-box' },
        el('div', { class: 'hint', style: 'padding:0', text: '구글 시트에서 파일 → 다운로드 → 쉼표로 구분된 값(.csv)으로 내려받은 파일을 선택하세요. 같은 파일을 다시 올려도 이미 있는 건(지원일+의뢰명 동일)은 건너뛰어 중복되지 않아요.' }),
        input, fileInfo, summary, warnBox, preview, errBox)),
      el('div', { class: 'panel-foot' }, el('span', { class: 'sp' }), el('button', { class: 'btn secondary', type: 'button', onclick: function () { close(); }, text: '취소' }), go));
    var overlay = el('div', { class: 'overlay', onmousedown: function (e) { if (e.target === overlay) close(); } }, panel);
    function onKey(e) { if (e.key === 'Escape') close(); }
    function close() { document.removeEventListener('keydown', onKey); overlay.remove(); closePanel = null; if (opener && opener.focus && document.body.contains(opener)) opener.focus(); }
    closePanel = close; document.addEventListener('keydown', onKey); document.body.appendChild(overlay); input.focus();
  }

  function soonView(label) {
    return [pageHead(label), el('div', { class: 'card empty', text: '준비 중인 기능입니다.' })];
  }

  function render() {
    if (!state.session) { renderLogin(); return; }
    var r = route();
    var page = r.page;
    var body;
    if (!state.loaded) body = [pageHead('불러오는 중…')];
    else if (page === 'inbox') body = inboxView();
    else if (page === 'dashboard') body = dashboardView();
    else if (page === 'projects') body = r.id ? projectDetailView(r.id) : projectsView();
    else if (page === 'customers') body = customersView();
    else if (page === 'leads') body = leadsView();
    else { var n = NAV.filter(function (x) { return x.id === page; })[0]; body = soonView(n ? n.label : '준비 중'); }
    app.replaceChildren(el('div', { class: 'shell' }, sidebar(page), el('main', { class: 'main' }, body)));
    if (state.loaded && page === 'dashboard') loadTraffic();
  }

  function start() {
    state.loaded = false;
    render();
    loadAll().then(render);
  }

  state.session = loadSession();
  if (state.session) start(); else render();
})();
</script>
</body>
</html>
