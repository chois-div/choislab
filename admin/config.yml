backend:
  name: github
  repo: chois-div/choislab
  branch: main

media_folder: "images/portfolio"
public_folder: "/images/portfolio"

collections:
  - name: "portfolio"
    label: "포트폴리오"
    files:
      - name: "portfolio"
        label: "포트폴리오 목록"
        file: "data/portfolio.json"
        format: "json"
        fields:
          - name: "portfolio"
            label: "프로젝트 목록"
            widget: "list"
            summary: "{{fields.name}} — {{fields.sub}}"
            fields:
              - { label: "썸네일 이미지", name: "image", widget: "image" }
              - label: "카테고리"
                name: "category"
                widget: "select"
                options:
                  - { label: "홈페이지 제작", value: "web" }
                  - { label: "랜딩페이지", value: "landing" }
                  - { label: "SNS 콘텐츠", value: "sns" }
              - { label: "프로젝트명", name: "name", widget: "string" }
              - { label: "설명", name: "sub", widget: "string" }
